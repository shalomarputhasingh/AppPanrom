name: Build Android APK

# Builds a REAL debug APK from an AppPanrom program on GitHub's runners (they have normal internet access
# and can install the Android SDK). The APK is uploaded as a downloadable artifact of the run.
on:
  push:
    branches: [claude/new-session-c11sr3]
    paths:
      - "android-template/**"
      - "backend/apppanrom/android/**"
      - "backend/apppanrom/lang/**"
      - "runtime/**"
      - "spec/**"
      - "examples/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: naal-planner, file: examples/naal_planner.apn }
          - { name: calculator, file: examples/calculator.apn }
          - { name: vanakkam, file: examples/vanakkam.apn }
    env:
      APP_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (the runner image already ships the SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile the AppPanrom program and generate the Android project
        working-directory: backend
        run: python -m apppanrom.cli android-project "../$APP_FILE" "$RUNNER_TEMP/app-${{ matrix.name }}"

      - name: Build the debug APK with Gradle
        working-directory: ${{ runner.temp }}/app-${{ matrix.name }}
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Verify the APK is real
        working-directory: backend
        run: |
          python - <<'PY'
          import os, pathlib, sys
          from apppanrom.android.builder import verify_apk
          apk = pathlib.Path(os.environ["RUNNER_TEMP"]) / "app-${{ matrix.name }}/app/build/outputs/apk/debug/app-debug.apk"
          problem = verify_apk(apk)
          print(apk, apk.stat().st_size if apk.exists() else "missing", "->", problem or "OK")
          sys.exit(1 if problem else 0)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AppPanrom-${{ matrix.name }}-debug-apk
          path: ${{ runner.temp }}/app-${{ matrix.name }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Saves the built APKs on a dedicated branch so they can be fetched with plain git (no artifact login needed).
  publish:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AppPanrom-*-debug-apk
          path: ${{ runner.temp }}/apks
      - name: Commit the APKs to the apk-builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds-tmp
          git rm -rf --quiet .
          for d in "$RUNNER_TEMP"/apks/*; do cp "$d/app-debug.apk" "./$(basename "$d").apk"; done
          printf 'Debug APKs built by GitHub Actions from commit %s\n' "$GITHUB_SHA" > README.txt
          sha256sum *.apk >> README.txt
          git add .
          git commit -q -m "APKs for $GITHUB_SHA"
          git push --force origin HEAD:apk-builds
