plugins {
    id 'com.android.application'
}

android {
    // Fixed code namespace; the user-facing application id is set below.
    namespace 'com.apppanrom.shell'
    compileSdk 34

    defaultConfig {
        applicationId "__APPLICATION_ID__"
        minSdk 24
        targetSdk 34
        versionCode __VERSION_CODE__
        versionName "__VERSION_NAME__"
    }

    // Release signing material is read from the environment of the Gradle process only (never from files in this project).
    signingConfigs {
        release {
            def storeFilePath = System.getenv("APPANROM_SIGN_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("APPANROM_SIGN_STORE_PASSWORD")
                keyAlias System.getenv("APPANROM_SIGN_KEY_ALIAS")
                keyPassword System.getenv("APPANROM_SIGN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the environment above this fails loudly instead of producing an unsigned "release".
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
